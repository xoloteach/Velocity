name: Deploy Velocity to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - project-velocity-final-web.zip
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Extract and verify the Godot web export
        run: |
          unzip -q project-velocity-final-web.zip -d web-export
          test -s web-export/project-velocity-web/index.html
          test -s web-export/project-velocity-web/index.wasm
          test -s web-export/project-velocity-web/index.pck
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web-export/project-velocity-web
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
